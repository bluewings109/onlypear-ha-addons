name: 오로지배 매출관리
description: 오로지배 거래처·품목·거래 관리
version: "0.29.0"
slug: onlypear_sales
url: https://github.com/bluewings109/onlypear-sales-management
arch:
  - aarch64
image: ghcr.io/bluewings109/onlypear-sales
startup: application
boot: auto
ports:
  8000/tcp: 8002
ports_description:
  8000/tcp: 웹 UI / API (내부망 접속용 호스트 포트)
# DB 덤프를 /share/onlypear-sales/backups 에 남긴다. HA 자동 백업이 share 폴더째 가져간다. (D-96)
map:
  - type: share
    read_only: false
options:
  database_url: ""
  log_level: info
schema:
  database_url: str
  # 기본값을 두지 않아서, 설정하지 않으면 HA가 add-on 시작을 막는다.
  login_password: password
  log_level: list(debug|info|warning|error)
  # 볼타 전자계산서 (D-86). 비워 두면 볼타 발행을 숨긴다.
  bolta_api_key: password?
  bolta_webhook_token: password?
